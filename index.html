<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Estère 💗</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💗%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1235;--pink:#ff4fa3;--fu:#d6198a;--vio:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden}
body{font:16px/1.6 Poppins,system-ui,sans-serif;color:var(--ink);background:#ffc2e0;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg i{position:absolute;inset:0;background-size:cover;background-position:center 25%;opacity:0;transition:opacity 1.8s ease;filter:blur(1px) saturate(1.15)}
.bg i.on{opacity:1;animation:kb 12s ease-out forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.16)}}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,227,241,.4),rgba(255,160,210,.3) 55%,rgba(139,92,246,.3))}
main{position:relative;z-index:2;flex:1;min-height:0;display:flex;padding:14px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.card{position:relative;width:min(620px,100%);margin:auto;overflow:hidden;background:rgba(255,255,255,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border:1px solid #fff;border-radius:28px;padding:clamp(22px,5vw,40px);box-shadow:0 20px 60px rgba(214,25,138,.3);text-align:center}
.wm{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:.55;filter:saturate(1.1);transition:background-image .6s;pointer-events:none;z-index:0;mask-image:radial-gradient(circle at 50% 40%,#000 55%,rgba(0,0,0,.35) 100%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 55%,rgba(0,0,0,.35) 100%)}
.in{position:relative;z-index:1;animation:up .8s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1{font-family:'Playfair Display',serif;font-size:clamp(28px,7.5vw,46px);line-height:1.15;margin:0 0 8px;background:linear-gradient(90deg,var(--fu),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 6px}.sub,.pl,.poem,h1+div{text-shadow:0 0 10px #fff,0 0 4px rgba(255,255,255,.9)}.gift{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(16px,4.2vw,20px);color:var(--fu);margin:4px auto 16px;padding-top:14px;max-width:420px;border-top:1px solid rgba(214,25,138,.35);text-shadow:0 0 10px #fff,0 0 4px #fff}.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.nav button{flex:1 1 150px;margin:0}
.poem{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(17px,4.4vw,22px);line-height:1.7;margin:14px 0 18px}
.poem span{display:block;opacity:0;animation:up .8s forwards}
.pl{font-size:clamp(16px,4vw,18px);margin:14px 0 18px}
button{font:600 16px Poppins;border:0;border-radius:999px;padding:13px 24px;margin:5px 4px;color:#fff;cursor:pointer;min-height:48px;max-width:100%;background:linear-gradient(135deg,var(--pink),var(--fu) 60%,var(--vio));box-shadow:0 8px 22px rgba(214,25,138,.4);transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-2px) scale(1.03)}button:active{transform:scale(.97)}
button.g{background:#fff;color:var(--fu);box-shadow:0 4px 14px rgba(0,0,0,.1)}
button.big{font-size:19px;padding:16px 30px;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,79,163,.2)}}
.dots{display:flex;justify-content:center;gap:7px;margin-top:12px}
.dots b{width:8px;height:8px;border-radius:9px;background:#fff;transition:.4s}.dots b.on{width:26px;background:var(--fu)}
.ph{display:flex;justify-content:center;gap:8px;margin:10px 0}
.ph img{width:clamp(52px,15vw,74px);height:clamp(52px,15vw,74px);object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(214,25,138,.35);animation:fl 3s ease-in-out infinite}
.ph img:nth-child(2){animation-delay:.4s}.ph img:nth-child(3){animation-delay:.8s}.ph img:nth-child(4){animation-delay:1.2s}
@keyframes fl{50%{transform:translateY(-7px)}}
footer{position:relative;z-index:2;text-align:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));font-size:14px;color:#fff;text-shadow:0 1px 6px rgba(120,0,70,.7)}
.h{position:fixed;top:-50px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(118vh) rotate(340deg)}}
.pop{position:fixed;pointer-events:none;z-index:50;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
@media(max-width:480px){main{padding:10px}.card{border-radius:22px}button.big{width:100%;font-size:17px}#go,#rl,#rp{width:100%;margin:5px 0}}
@media(max-height:500px){h1{font-size:26px}.poem{line-height:1.45;margin:8px 0 12px}.pl{margin:8px 0 12px}.ph img{width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.poem span{opacity:1}}
</style></head><body>
<div class="bg" id="bg"></div>
<main><div class="card"><div class="wm" id="wm"></div><div class="in" id="v"></div></div></main>

const P=[
["Estère, aujourd’hui c’est ton day,","que le monde entier le sache. ✨","Une nouvelle année commence,","et que chaque jour te porte plus haut."],
["Je te souhaite une longue vie, une santé solide,","la paix dans ton cœur et la joie autour de toi.","May God bless your journey,","and keep you safe wherever you go. 🙏"],
["Que tes rêves deviennent réalité,","que tes efforts payent, que tes projets réussissent,","et que les galères s’éloignent pour de bon.","Big wins only, ma queen. 💫"],
["Full cash dans les poches, 💸","des opportunités, des portes qui s’ouvrent,","l’amour qui t’entoure, et la protection","sur chacun de tes pas."],
["Garde ton sourire, ton flow, ta lumière.","Real talk, tu comptes beaucoup pour moi,","et je voulais que tu le saches.","Happy birthday, ma queen. 💗"]];
const V=document.getElementById('v'),bg=document.getElementById('bg'),wm=document.getElementById('wm');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
bg.innerHTML=IMG.map(s=>`<i style="background-image:url(${s})"></i>`).join('');
const L=[...bg.children];let k=0;
function cycle(){L.forEach((e,i)=>e.classList.toggle('on',i===k));wm.style.backgroundImage=`url(${IMG[(k+1)%4]})`;k=(k+1)%4}
cycle();setInterval(cycle,6000);
let n=-1;
const dots=i=>`<div class="dots">${P.map((_,j)=>`<b class="${j===i?'on':''}"></b>`).join('')}</div>`;
function render(){
 if(n<0){V.innerHTML=`<h1>Happy Birthday<br>${NAME} 💗</h1><p class="sub">Hey birthday girl ! ✨</p><p class="pl">Today is YOUR day, ma queen.<br>J’ai préparé quelques mots pour toi.<br>Take your time, enjoy the moment. 💌</p><p class="gift">Ce site, je l’ai payé rien que pour t’offrir ce cadeau,<br>parce que tu le mérites, Estère. 💎</p><button class="big" id="go">Okay, let’s start 💌</button>`;go.onclick=()=>{n=0;burst(innerWidth/2,innerHeight/2);render()}}
 else if(n<P.length){V.innerHTML=`<div class="poem">${P[n].map((l,i)=>`<span style="animation-delay:${i*.35}s">${l}</span>`).join('')}</div>
 <div class="nav"><button class="g" id="pv" ${n===0?'disabled style="opacity:.4"':''}>← Précédent</button><button id="nx">${n===P.length-1?'Unlock the final surprise 💖':'Suivant →'}</button></div>${dots(n)}`;
  pv.onclick=()=>{n--;render()};nx.onclick=()=>{n++;render()}}
 else{V.innerHTML=`<h1>You made it to the end 🥹💗</h1><div class="ph">${IMG.map(s=>`<img src="${s}" alt="">`).join('')}</div>
 <p class="pl">J’espère que ces quelques mots t’ont fait sourire. Tu mérites une vie remplie de paix, de love, de réussite et de blessings.<br><br>Long life, full cash, big wins et zéro bad vibes. May God bless your journey and protect your smile. ❤️<br><br><b>Happy birthday, ${NAME}.<br>You mean a lot to me, for real. 💖</b></p>
 <button class="big" id="rl">Release the love 💗</button><button class="g" id="rp">↺ Revoir</button><p id="fe" class="poem" style="margin:6px 0 0"></p>`;
  rl.onclick=()=>{rain(70);fe.textContent="Love you, birthday queen 💖👑"};rp.onclick=()=>{n=-1;render()}}
}
const E=['💗','💖','❤️','💗','⭐','✨','💕','🌸'];
function rain(c){if(reduce)return;for(let j=0;j<c;j++){const h=document.createElement('div');h.className='h';h.textContent=E[Math.random()*E.length|0];
 h.style.cssText+=`left:${Math.random()*100}vw;font-size:${16+Math.random()*28}px;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*1.6}s`;document.body.append(h);setTimeout(()=>h.remove(),8000)}}
function burst(x,y,c=7){if(reduce)return;for(let j=0;j<c;j++){const h=document.createElement('div');h.className='pop';h.textContent=E[Math.random()*E.length|0];
 const a=Math.random()*6.28,d=40+Math.random()*60;h.style.cssText+=`left:${x}px;top:${y}px;font-size:${14+Math.random()*12}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-20}px`;document.body.append(h);setTimeout(()=>h.remove(),1000)}}
addEventListener('pointerdown',e=>{if(e.target.closest('button'))burst(e.clientX,e.clientY,6)});
addEventListener('keydown',e=>{if(n>=0&&n<P.length){if(e.key==='ArrowRight'){n++;render()}if(e.key==='ArrowLeft'&&n>0){n--;render()}}});
let tx;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx==null||n<0||n>=P.length)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70){if(d<0){n++;render()}else if(n>0){n--;render()}}tx=null},{passive:true});
render();
</script></body></html>
